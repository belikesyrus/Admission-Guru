<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Admission Guru</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/auth.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>
<nav class="navbar" id="navbar">
  <div class="nav-inner">
    <a href="/" class="nav-logo">
      <span class="logo-icon">🎓</span>
      <span class="logo-text">Admission<span class="logo-accent">Guru</span></span>
    </a>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><span>🎓</span><span>Admission<span class="logo-accent">Guru</span></span></div>
    <h1 class="auth-title">Reset your password</h1>
    <p class="auth-sub">Enter your email and we'll send a reset link (demo mode)</p>

    <div id="alertBox"></div>

    <form id="forgotForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input class="form-input" type="email" id="email" placeholder="you@example.com" required />
      </div>
      <button type="submit" class="btn-primary btn-full">Send Reset Link</button>
    </form>

    <div class="auth-divider"><span>Remember your password?</span></div>
    <a href="login.html" class="btn-outline btn-full" style="text-align:center">Back to Login</a>
  </div>
</div>

<script src="../js/auth-state.js"></script>
<script>
document.getElementById("forgotForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  if (!email) return;
  document.getElementById("alertBox").innerHTML =
    `<div class="alert alert-success">✅ If an account exists for <strong>${email}</strong>, a reset link has been sent. (Demo mode — check with the admin)</div>`;
});
</script>
</body>
</html>
