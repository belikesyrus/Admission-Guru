<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Admission Guru</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/auth.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>
<nav class="navbar" id="navbar">
  <div class="nav-inner">
    <a href="/" class="nav-logo">
      <span class="logo-icon">🎓</span>
      <span class="logo-text">Admission<span class="logo-accent">Guru</span></span>
    </a>
    <button class="nav-toggle" id="navToggle">&#9776;</button>
    <ul class="nav-links" id="navLinks">
      <li><a href="/" class="nav-link">Home</a></li>
      <li><a href="predict.html" class="nav-link">Predict College</a></li>
      <li id="authLinks">
        <a href="login.html" class="nav-link btn-outline-sm">Login</a>
        <a href="signup.html" class="nav-link btn-primary-sm">Sign Up</a>
      </li>
      <li id="userMenu" style="display:none">
        <span class="user-greeting" id="userGreeting"></span>
        <button class="btn-outline-sm" id="logoutBtn">Logout</button>
      </li>
    </ul>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span>🎓</span>
      <span>Admission<span class="logo-accent">Guru</span></span>
    </div>
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-sub">Free — save and revisit your college lists anytime</p>

    <div id="alertBox"></div>

    <form id="signupForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="name">Full Name <span class="required">*</span></label>
        <input class="form-input" type="text" id="name" name="name"
               placeholder="Riya Sharma" autocomplete="name" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Email Address <span class="required">*</span></label>
        <input class="form-input" type="email" id="email" name="email"
               placeholder="you@example.com" autocomplete="email" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="phone">Phone Number (optional)</label>
        <input class="form-input" type="tel" id="phone" name="phone"
               placeholder="+91 98765 43210" autocomplete="tel" />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password <span class="required">*</span></label>
        <div class="input-eye-wrapper">
          <input class="form-input" type="password" id="password" name="password"
                 placeholder="Min 6 characters" autocomplete="new-password" required />
          <button type="button" class="eye-btn" id="eyeBtn">👁️</button>
        </div>
        <span class="form-hint">At least 6 characters</span>
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm">Confirm Password <span class="required">*</span></label>
        <input class="form-input" type="password" id="confirm" name="confirm"
               placeholder="Re-enter password" autocomplete="new-password" required />
      </div>
      <button type="submit" class="btn-primary btn-full" id="signupBtn">
        <span id="signupBtnText">Create Account →</span>
        <span id="signupBtnLoader" style="display:none"><span class="spinner-inline"></span> Creating...</span>
      </button>
    </form>

    <div class="auth-divider"><span>Already have an account?</span></div>
    <a href="login.html" class="btn-outline btn-full" style="text-align:center">Login</a>
  </div>
</div>

<script src="../js/auth-state.js"></script>
<script>
const API = (location.protocol === "file:" || location.hostname === "") ? "http://localhost:5000/api" : "/api";

if (AuthState.isLoggedIn()) {
  window.location.href = "dashboard.html";
}

function showAlert(msg, type = "error") {
  const b = document.getElementById("alertBox");
  b.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
}

document.getElementById("eyeBtn").addEventListener("click", () => {
  const pw = document.getElementById("password");
  pw.type = pw.type === "password" ? "text" : "password";
});

document.getElementById("signupForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name     = document.getElementById("name").value.trim();
  const email    = document.getElementById("email").value.trim();
  const phone    = document.getElementById("phone").value.trim();
  const password = document.getElementById("password").value;
  const confirm  = document.getElementById("confirm").value;

  if (!name || !email || !password) {
    showAlert("Name, email and password are required."); return;
  }
  if (password.length < 6) {
    showAlert("Password must be at least 6 characters."); return;
  }
  if (password !== confirm) {
    showAlert("Passwords do not match."); return;
  }

  const btn = document.getElementById("signupBtn");
  btn.disabled = true;
  document.getElementById("signupBtnText").style.display   = "none";
  document.getElementById("signupBtnLoader").style.display = "";

  try {
    const res  = await fetch(`${API}/auth/register`, {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ name, email, password, phone }),
    });
    const data = await res.json();

    if (!res.ok) {
      showAlert(data.error || "Registration failed."); return;
    }

    AuthState.setSession(data.user.token, data.user);
    showAlert("Account created! Redirecting...", "success");
    setTimeout(() => { window.location.href = "dashboard.html"; }, 1000);

  } catch {
    showAlert("Network error. Please try again.");
  } finally {
    btn.disabled = false;
    document.getElementById("signupBtnText").style.display   = "";
    document.getElementById("signupBtnLoader").style.display = "none";
  }
});
</script>
</body>
</html>
